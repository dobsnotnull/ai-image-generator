<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Aether | Ai image generator</title>

</head>

<body>


    <!-- The container thing itself -->

    <div class="container">


        <!-- Header of the container thingy -->

        <header class="header">

            <div class="logo-wrapper">

                <div class="logo">

                    <i data-lucide="sparkles"></i>

                </div>

                <h1>Aether | Ai Image Generator</h1>

            </div>
            
            <button class="theme-toggle">

                <i data-lucide="moon"></i>

            </button>

        </header>

        <div class="main-content">

            <form action="#" class="prompt-form">



            <!-- Prompt contiainer -->

            <div class="prompt-container">

                <textarea class="prompt-input" placeholder="Use your imagination..." required autofocus></textarea>

                <button type="button" class="prompt-btn">

                    <i data-lucide="pencil-sparkles"></i>

                </button>

            </div>



            <!-- Prompts actions/butttons -->

            <div class="prompt-actions">



                <!-- The one for the AI models -->

                <div class="select-wrapper">

                    <select class="custom-select" required>

                        <option value="" selected disabled>AI Engine</option>
                        <option value="black-forest-labs/FLUX.1-dev">FLUX.1-dev</option>
                        <option value="black-forest-labs/FLUX.1-schnell">FLUX.1-schnell</option>
                        <option value="stabilityai/stable-diffusion-xl-base-1.0">Stable Diffusion XL</option>
                        <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion v1.5</option>
                        <option value="prompthero/openjourney">OpenJourney</option>

                    </select>

                </div>


                <!-- number selection -->

                <div class="select-wrapper" >

                    <select class="custom-select" required>

                        <option value="" selected disabled>Image count</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>

                    </select>

                </div>



                <!-- Sizing for the images -->

                <div class="select-wrapper" >

                    <select class="custom-select" required>

                        <option value="" selected disabled>Size</option>
                        <option value="1/1">1:1</option>
                        <option value="16/9">16:9</option>
                        <option value="9/16">9:16</option>

                    </select>

                </div>




                <!-- Generate Button -->


                <button type="submit" class="generate-btn">

                    <i data-lucide="wand-sparkles"></i>

                    Generate

                </button>

            </div>

            </form>

            
            <!-- The gallery for the images to appear -->

            <div class="gallery-grid">


                
                <!-- The first one  -->

                <div class="img-card">

                    <img src="test.webp" class="result-img">

                    <div class="img-overlay">
                        
                        <button class="img-download-btn">

                            <i data-lucide="download"></i>

                        </button>

                    </div>

                </div>



                <!-- The second one  -->

                <div class="img-card">

                    <img src="test.webp" class="result-img">

                    <div class="img-overlay">
                        
                        <button class="img-download-btn">

                            <i data-lucide="download"></i>

                        </button>

                    </div>

                </div>





                <!-- The Third one  -->

                <div class="img-card">

                    <img src="test.webp" class="result-img">

                    <div class="img-overlay">
                        
                        <button class="img-download-btn">

                            <i data-lucide="download"></i>

                        </button>

                    </div>

                </div>




                <!-- The fourth one  -->

                <div class="img-card">

                    <img src="test.webp" class="result-img">

                    <div class="img-overlay">
                        
                        <button class="img-download-btn">

                            <i data-lucide="download"></i>

                        </button>

                    </div>

                </div>



        </div>


        </div>

    </div>

    <script>
    
        lucide.createIcons();

    </script>
    
</body>

</html>
